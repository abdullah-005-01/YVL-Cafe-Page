<!DOCTYPE html>
<html>
<head>
    <title>Cafe Menu - YVL Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        table, th, td {
            border: 1px solid black;

</head>

    <h2>Menu</h2>
    <table style="width:100%">
        <tr>

            <th>Category</th>
            <th>Price (Rs.)</th>

            <td>Paratha Roll</td>
            <td>Breakfast</td>

        </tr>
        <tr>
            <td>Donuts</td>
            <td>Breakfast</td>
            <td>180</td>

        <tr>

            <td>Drinks</td>

    <button onclick="placeOrder()">Order</button>

    <script>
        function placeOrder() {
            window.alert("Order confirmed! Your food will be ready soon.");
        }
    </script>
